# Continuous integration (spec section 9.10).
#
# Spec 9.10 asks for "lint, type-check, and automated tests running on every pull request
# before merge". This runs all three plus a production build, because a Next.js build catches
# a different class of problem than tsc does (server/client boundary violations, for one).
#
# The database job is separate and is the one that matters most: it applies every migration to
# a real Postgres with PostGIS, then runs supabase/tests/schema_checks.sql, which asserts that
# the rules in docs/ASSUMPTIONS.md are actually enforced - capacity limits, checkout holds, the
# payout dispute hold, listing re-approval, the review window. Those are trigger behaviours
# that type-checking and unit tests cannot see, and three of them were caught by exactly this
# check the first time it ran.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders: the app validates its environment at boot, and `next build` boots it.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  ACCESS_PASS_SECRET: ci-access-pass-secret-at-least-32-chars-long

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Migrations, RLS and schema behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Apply migrations and seed
        run: pnpm exec supabase db reset

      # A table with RLS disabled is readable by anyone holding the anon key, which is public
      # by design. This turns that into a failed build rather than a discovery in production.
      - name: Assert RLS is enabled on every public table
        env:
          PGPASSWORD: postgres
        run: |
          UNPROTECTED=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tAc \
            "select coalesce(string_agg(tablename, ', '), '') from pg_tables
              where schemaname = 'public' and not rowsecurity;")

          if [ -n "$UNPROTECTED" ]; then
            echo "::error::Tables without RLS: $UNPROTECTED"
            exit 1
          fi
          echo "All public tables have RLS enabled."

      # The behavioural suite. Exits non-zero if any assertion fails.
      - name: Schema behaviour checks
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/schema_checks.sql

      # The generated types are committed so the verify job type-checks against the same schema
      # a developer had. If they drift, the build is checking something that no longer exists.
      - name: Assert committed database types are up to date
        run: |
          pnpm exec supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts packages/types/src/database.types.ts > /dev/null; then
            echo "::error::packages/types/src/database.types.ts is stale - run 'pnpm db:types' and commit"
            diff /tmp/database.types.ts packages/types/src/database.types.ts | head -40
            exit 1
          fi
          echo "Database types are current."
